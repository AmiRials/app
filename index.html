const IC = {moon:'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z',sun:'M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4',bell:'M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9zM13.7 21a2 2 0 01-3.4 0',home:'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',check:'M5 13l4 4L19 7',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',hist:'M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5M12 7v5l3 2',share:'M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13',cog:'M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z',users:'M17 20v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 10a4 4 0 100-8 4 4 0 000 8zM21 20v-2a4 4 0 00-3-3.9M16 2.1a4 4 0 010 7.8',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',img:'M4 5h16v14H4zM8.5 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM20 16l-5-5-9 8',out:'M9 21H5a1 1 0 01-1-1V4a1 1 0 011-1h4M16 17l5-5-5-5M21 12H9',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',plus:'M12 5v14M5 12h14',heart:'M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z',link:'M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1',pay:'M3 7h18v10H3zM3 11h18',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',dl:'M12 3v12M7 10l5 5 5-5M4 20h16',menu:'M4 6h16M4 12h16M4 18h16',x:'M6 6l12 12M18 6L6 18',gift:'M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z',copy:'M9 9h11v11H9zM5 15H4V4h11v1',skip:'M5 4l10 8-10 8zM19 5v14',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',play:'M6 4l14 8-14 8z',lock:'M6 11h12v10H6zM8 11V7a4 4 0 018 0v4'};

const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

/* ---------- storage: localStorage + cookie + IndexedDB + memory (กันหลุดล็อกอินบน iOS) ---------- */
const mem = {};
const IDB = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open('amirials', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); },
  async tx(mode, fn) { try { if (!this.db) this.db = await this.open(); if (!this.db) return ''; return await new Promise(res => { const q = fn(this.db.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => res(q.result || ''); q.onerror = () => res(''); }); } catch (e) { return ''; } },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  set(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); }

const st = {
  get(k) { try { const v = localStorage.getItem(k); if (v) return v; } catch (e) {} const m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : mem[k] || ''; },

  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} try { document.cookie = k + '=;max-age=0;path=/'; } catch (e) {} IDB.del(k); }
};
const keepStorage = () => { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} };

/* เรียก Apps Script Web App (POST แบบ text/plain เพื่อเลี่ยง CORS preflight) — คำสั่งอ่านข้อมูลลองซ้ำอัตโนมัติ 1 ครั้งเมื่อเน็ตสะดุด */
const READS = new Set(['init', 'cfg', 'me', 'ping', 'badge', 'mission', 'getMission', 'myPosts', 'history', 'shareStats', 'publicPage', 'previewUrl', 'dash', 'users', 'payments', 'allPosts', 'banners', 'revenue', 'superStats', 'getSettings']);
const call = async (a, p = {}) => {
  let r = null;
  for (let i = 0, n = READS.has(a) ? 2 : 1; i < n && !r; i++) {
    try { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 45000); const x = await fetch(API, {method: 'POST', body: JSON.stringify({a, p: Object.assign({t: T, vid: VID}, p)}), signal: ac.signal}); clearTimeout(tm); r = await x.json(); } catch (e) { r = null; }
  }
  if (r && r.ok) return r.d; if (r) throw new Error(r.m || 'เกิดข้อผิดพลาด'); throw new Error('NET');
};
/* เริ่มโหลดข้อมูลทันทีขณะไลบรารีกำลังโหลด (ทำให้เปิดเว็บเร็วขึ้น) */
const wrap = p => p.then(d => ({d}), e => ({e}));
const P_INIT = wrap(call('init'));

let BADGE = {users: 0, pays: 0};
function updateBadge(b) { BADGE = b; const n = b.users + b.pays; document.querySelectorAll('.bellN').forEach(e => { e.textContent = n > 99 ? '99+' : n; e.style.display = n ? 'flex' : 'none'; }); [['.bdusers', b.users], ['.bdpay', b.pays]].forEach(a => document.querySelectorAll(a[0]).forEach(e => { e.textContent = a[1]; e.style.display = a[1] ? 'flex' : 'none'; })); }
async function pollBadge() { if (!T || !ME || ME.u.role === 'user') return; try { const b = await call('badge'), prev = BADGE.users + BADGE.pays, n = b.users + b.pays; if (window.__bi && n > prev) toast('มีรายการใหม่รอตรวจ ' + n + ' รายการ', 'info'); window.__bi = 1; updateBadge(b); } catch (e) {} }
async function bellClick() { const b = BADGE; if (!b.users && !b.pays) return toast('ไม่มีรายการค้างตรวจ', 'info'); const r = await Swal.fire({title: 'รายการรอตรวจสอบ', html: `สมัครใหม่รออนุมัติ <b style="color:#dc2626">${b.users}</b> คน<br>สลิปต่ออายุ/ต่อลิงก์แชร์ <b style="color:#dc2626">${b.pays}</b> รายการ`, showDenyButton: true, showCancelButton: true, confirmButtonText: 'ตรวจสมาชิกใหม่', denyButtonText: 'ตรวจสลิปต่ออายุ', cancelButtonText: 'ปิด', confirmButtonColor: '#ff5a1f', denyButtonColor: '#0fb89c'}); if (r.isConfirmed) go('users'); else if (r.isDenied) go('pay'); }

const err = e => { if (e.message === 'EXPIRED') return boot(); if (e.message === 'AUTH') { st.del('ls_token'); T = ''; return boot(); } Swal.fire({icon: 'error', title: 'ไม่สำเร็จ', text: e.message === 'NET' ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่' : e.message, confirmButtonColor: '#ff5a1f'}); };

function miniToast(m) { let e = $('#mt'); if (!e) { e = document.createElement('div'); e.id = 'mt'; e.style.cssText = 'position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:99999;background:#1f1b2e;color:#fff;padding:.55rem 1rem;border-radius:99px;font-size:.9rem;transition:opacity .2s;pointer-events:none;opacity:0'; document.body.appendChild(e); } e.textContent = m; e.style.opacity = 1; clearTimeout(e._t); e._t = setTimeout(() => e.style.opacity = 0, 1600); }

function reelGo() {
  if (LOPEN) return;   // กดซ้ำเพื่อเปิดคลิปอีกครั้งได้ แต่ไม่เริ่มนับใหม่
  LOPEN = 1; LCD = LWAIT; clearInterval(LT);
  setTimeout(() => { const b = $('#reelBtn'); if (b) b.classList.add('done'); const t = $('#reelTx'); if (t) t.textContent = 'เปิดคลิปอีกครั้ง'; setL(); }, 200);   // หน่วงไว้ให้เบราว์เซอร์เปิดลิงก์ก่อน
  LT = setInterval(() => {
    if (!$('#lflow')) { clearInterval(LT); return; }   // ออกจากหน้าภารกิจแล้ว
    LCD--; const e = $('#lcd'); if (e) e.textContent = Math.max(0, LCD);

  }, 1000);
}

async function skipM(type) {
  const f = type === 'follow', sk = f ? SKF : SKL, cur = f ? MF : ML; if (cur) sk.push(f ? cur.uid + '|' + cur.platform : cur.postId);

  if (f) { MF = m; $('#cardF').innerHTML = cardF(m); } else { ML = m; $('#cardL').innerHTML = cardL(m); }
}
async function subM(type) {
  const f = type === 'follow', m = f ? MF : ML; if (!m) return;
  const ok = await busy(() => call('submitMission', f ? {type, targetUserId: m.uid, platform: m.platform, answer: $('#ansF').value} : {type, postId: m.postId, answer: $('#ansL').value}));
  if (ok) { ME_T = 0; delete VC.profile; await Swal.fire({icon: 'success', title: 'ภารกิจสำเร็จ', timer: 1200, showConfirmButton: false}); rr(); }
}

let BIMG = '';
async function editBan(i) {
  const b = i === undefined ? {title: '', img: '', link: '', active: true} : BL[i]; BIMG = '';
  const r = await Swal.fire({title: 'แบนเนอร์', html: `<input id="bt" class="swal2-input" placeholder="ชื่อแบนเนอร์" value="${esc(b.title)}"><div class="my-3"><img id="bp" src="${esc(b.img)}" class="${b.img ? '' : 'hidden'} mx-auto max-h-40 rounded-xl mb-2"><button type="button" class="btn ghost sm" onclick="pick(d=>{BIMG=d;$('#bp').src=d;$('#bp').classList.remove('hidden')},1200)">${ic('img', 'w-4 h-4')} อัปโหลดรูปแบนเนอร์</button></div><input id="bl" class="swal2-input" placeholder="ลิงก์ปลายทาง (เว้นว่างได้ = แตะแล้วไม่เกิดอะไร)" value="${esc(b.link)}"><label class="text-sm"><input type="checkbox" id="ba" ${b.active ? 'checked' : ''}> แสดงผล</label>`, showCancelButton: true, confirmButtonColor: '#ff5a1f', confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', preConfirm: () => { if (!BIMG && !b.img) { Swal.showValidationMessage('กรุณาอัปโหลดรูปแบนเนอร์'); return false; } return {id: b.id, title: $('#bt').value, file: BIMG, link: $('#bl').value, active: $('#ba').checked}; }});
  if (r.isConfirmed) { await busy(() => call('saveBanner', r.value)); rr(); }
}
async function saveSet(keys) {
  const s = {}; keys.forEach(k => { const e = $('#s_' + k); if (e) s[k] = e.value; });
  if (await busy(() => call('saveSettings', {s, bankQr: BQR, clearBankQr: BQX}))) { BQR = ''; BQX = false; toast('บันทึกแล้ว'); try { const r = await call('cfg'); S = r.s; st.set('ls_S', JSON.stringify(S)); } catch (e) {} rr(); }
}


/* ---------- จัดการโพสต์: แก้ไข (หัวข้อ/ชื่อสินค้า) และขยายเวลาภารกิจ ---------- */
const PM = {}, inv = () => { delete VC.posts; delete VC.myposts; delete VC.aposts; };
const postRow = (p, adm) => {
  PM[p.id] = p; const s = !p.until ? ['เปิดภารกิจไม่จำกัดเวลา', 'text-gray-400'] : p.open ? ['เปิดภารกิจถึง ' + p.until, 'text-emerald-600'] : ['หมดเวลาภารกิจแล้ว (' + p.until + ')', 'text-red-500'];
  return `<div class="box space-y-3"><div class="flex items-center gap-3">${p.image ? `<img src="${esc(p.image)}" loading="lazy" referrerpolicy="no-referrer" class="w-14 h-14 rounded-xl object-cover" onerror="this.remove()">` : ''}<div class="min-w-0 flex-1"><div class="font-medium truncate">${esc(p.title)}</div>${adm ? `<div class="text-xs text-gray-500">@${esc(p.by)} • ${esc(p.at)}</div>` : ''}<a class="text-xs text-orange-600 truncate block" href="${esc(p.url)}" target="_blank">${esc(p.url)}</a><div class="text-xs ${s[1]}">${s[0]}</div></div></div><div class="flex flex-wrap gap-2"><button class="btn ghost sm" onclick="editPost('${p.id}')">${ic('edit', 'w-4 h-4')} แก้ไข</button>${p.until ? `<button class="btn mint sm" onclick="extendPost('${p.id}')">${ic('plus', 'w-4 h-4')} ขยายเวลาภารกิจ</button>` : ''}<button class="btn ghost sm" onclick="delPost('${p.id}')">${ic('trash', 'w-4 h-4')}</button></div></div>`;
};
async function editPost(id) {
  const p = PM[id]; if (!p) return;
  const r = await Swal.fire({title: 'แก้ไขโพสต์', html: `<input class="swal2-input" value="${esc(p.url)}" disabled style="opacity:.55"><input id="et" class="swal2-input" placeholder="หัวข้อ/เรื่องของคลิป" value="${esc(p.title)}"><textarea id="en" class="swal2-textarea" placeholder="ชื่อสินค้าบน Shopee">${esc(p.name)}</textarea><p style="font-size:.8rem;opacity:.7">ลิงก์รีลแก้ไขไม่ได้ หากต้องการเปลี่ยนคลิปให้ลบแล้วโพสต์ใหม่<br>ชื่อสินค้าใหม่จะใช้ตรวจภารกิจต่อจากนี้</p>`, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ff5a1f', preConfirm: () => { const t = $('#et').value.trim(), n = $('#en').value.trim(); if (!t || !n) { Swal.showValidationMessage('กรุณากรอกให้ครบทั้ง 2 ช่อง'); return false; } return {title: t, name: n}; }});
  if (r.isConfirmed && await busy(() => call('editPost', {id, title: r.value.title, name: r.value.name}))) { toast('บันทึกแล้ว'); inv(); rr(); }
}
async function extendPost(id) {
  const p = PM[id]; if (!p) return;
  const r = await Swal.fire({title: 'ขยายเวลาภารกิจ', html: `<div style="font-size:.9rem">${esc(p.title)}</div><div style="font-size:.8rem;opacity:.7;margin-top:4px">${p.open ? 'ตอนนี้เปิดถึง ' + esc(p.until) : 'หมดเวลาแล้ว เมื่อ ' + esc(p.until) + ' (ขยายแล้วจะเปิดให้ทำอีกครั้ง)'}<br>เฉพาะคนที่ยังไม่เคยทำโพสต์นี้เท่านั้นที่จะได้ภารกิจ</div>`, input: 'select', inputOptions: {1: 'เพิ่ม 1 วัน', 3: 'เพิ่ม 3 วัน', 7: 'เพิ่ม 7 วัน'}, inputValue: 3, showCancelButton: true, confirmButtonText: 'ขยายเวลา', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ff5a1f'});
  if (r.isConfirmed) { const n = await busy(() => call('extendPost', {id, days: +r.value})); if (n) { toast('เปิดภารกิจถึง ' + n); inv(); rr(); } }
}

/* ---------- PUBLIC SHARE PAGE ---------- */
async function pubView() {
  const x = await P_PUB;
  if (x.e) { $('#app').innerHTML = `<div class="p-10 text-center">${esc(x.e.message === 'NET' ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่' : x.e.message)}</div>`; return; }
  const d = x.d, u = d.user; OWNER = d.oid;
  $('#app').innerHTML = `<div class="max-w-md mx-auto p-4 space-y-4"><div class="t${u.theme} text-white rounded-3xl p-6 text-center rise"><div class="w-24 h-24 rounded-full bg-white/20 mx-auto overflow-hidden flex items-center justify-center">${u.avatar ? `<img src="${esc(u.avatar)}" referrerpolicy="no-referrer" class="w-full h-full object-cover">` : ic('user', 'w-10 h-10')}</div><div class="text-xl font-bold mt-3">@${esc(u.username)}</div><div class="flex gap-2 mt-4 justify-center">${u.fbUrl ? `<a class="btn ghost sm" href="${esc(u.fbUrl)}" target="_blank">ติดตาม Facebook</a>` : ''}${u.igUrl ? `<a class="btn ghost sm" href="${esc(u.igUrl)}" target="_blank">ติดตาม Instagram</a>` : ''}</div></div>${d.posts.map(p => `<a href="${esc(p.url)}" target="_blank" onclick="trk('${esc(p.id)}')" class="block box !p-0 overflow-hidden">${p.image ? `<img src="${esc(p.image)}" loading="lazy" referrerpolicy="no-referrer" class="w-full max-h-52 object-cover" onerror="this.remove()">` : ''}<div class="p-3"><div class="font-medium">${esc(p.title)}</div><div class="text-xs text-gray-500">${esc(p.host)}</div></div></a>`).join('') || empty('ยังไม่มีโพสต์')}</div>`;
}
/* สคริปต์ภายนอกแบบ defer โหลดเสร็จก่อน DOMContentLoaded เสมอ จึงเริ่ม boot ตอนนั้น (ส่วนการเรียก API เริ่มไปแล้วด้านบน) */
addEventListener('DOMContentLoaded', boot);
</script>
