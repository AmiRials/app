<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmiRials</title>
<link rel="icon" href="https://i.postimg.cc/zvjMdhbh/Logo-Ami-Rials.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/zvjMdhbh/Logo-Ami-Rials.png">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--ink:#1f1b2e;--or:#ff5a1f;--mint:#0fb89c;--paper:#fff7ef}
*{font-family:'Prompt',sans-serif}
body{background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent}
.hero{background:linear-gradient(120deg,#ff5a1f,#ff9a3c,#0fb89c,#ff5a1f);background-size:300% 300%;animation:flow 12s ease infinite}
@keyframes flow{50%{background-position:100% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s ease both}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.1rem;border-radius:.9rem;font-weight:600;transition:transform .15s,box-shadow .15s;background:var(--or);color:#fff;box-shadow:0 6px 16px -6px rgba(255,90,31,.6)}
.btn:active{transform:scale(.96)} .btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px #e7ddd0}
.btn.mint{background:var(--mint);box-shadow:0 6px 16px -6px rgba(15,184,156,.6)} .btn.sm{padding:.4rem .7rem;font-size:.85rem;border-radius:.7rem}
.in{width:100%;padding:.7rem .9rem;border-radius:.9rem;border:1.5px solid #e7ddd0;background:#fff;outline:none}
.in:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(255,90,31,.15)}
.box{background:#fff;border-radius:1.2rem;padding:1.1rem;box-shadow:0 8px 24px -14px rgba(31,27,46,.35)}
.bar{height:.8rem;background:#f1e6da;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#ffb13c);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.t0{background:linear-gradient(135deg,#1f1b2e,#4b3f72)}.t1{background:linear-gradient(135deg,#ff5a1f,#ffb13c)}.t2{background:linear-gradient(135deg,#0fb89c,#2a6f97)}.t3{background:linear-gradient(135deg,#c9184a,#ff758f)}
.tab{padding:.5rem .9rem;border-radius:99px;white-space:nowrap;font-weight:500;color:#6b6478}.tab.on{background:var(--ink);color:#fff}
.swal2-popup{font-family:'Prompt',sans-serif;border-radius:1.2rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="min-h-screen"></div>
<script>
/* ===== ตั้งค่า: URL ของ Apps Script Web App ===== */
const API = 'https://script.google.com/macros/s/AKfycbz6yMFmlJBoJCqjzI7qX_mJkWxEZp-Nbqz0Z2luwqFbvl6KakJGsN9QbqSVlplG0tmM/exec';
const LOGO = 'https://i.postimg.cc/zvjMdhbh/Logo-Ami-Rials.png';
const QS = new URLSearchParams(location.search);
const PUB = QS.get('id') || '', REF = (QS.get('ref') || '').trim().replace(/^@/, '');
const BASE = location.origin + location.pathname;
const PROV = 'กรุงเทพมหานคร,กระบี่,กาญจนบุรี,กาฬสินธุ์,กำแพงเพชร,ขอนแก่น,จันทบุรี,ฉะเชิงเทรา,ชลบุรี,ชัยนาท,ชัยภูมิ,ชุมพร,เชียงราย,เชียงใหม่,ตรัง,ตราด,ตาก,นครนายก,นครปฐม,นครพนม,นครราชสีมา,นครศรีธรรมราช,นครสวรรค์,นนทบุรี,นราธิวาส,น่าน,บึงกาฬ,บุรีรัมย์,ปทุมธานี,ประจวบคีรีขันธ์,ปราจีนบุรี,ปัตตานี,พระนครศรีอยุธยา,พังงา,พัทลุง,พิจิตร,พิษณุโลก,เพชรบุรี,เพชรบูรณ์,แพร่,พะเยา,ภูเก็ต,มหาสารคาม,มุกดาหาร,แม่ฮ่องสอน,ยโสธร,ยะลา,ร้อยเอ็ด,ระนอง,ระยอง,ราชบุรี,ลพบุรี,ลำปาง,ลำพูน,เลย,ศรีสะเกษ,สกลนคร,สงขลา,สตูล,สมุทรปราการ,สมุทรสงคราม,สมุทรสาคร,สระแก้ว,สระบุรี,สิงห์บุรี,สุโขทัย,สุพรรณบุรี,สุราษฎร์ธานี,สุรินทร์,หนองคาย,หนองบัวลำภู,อ่างทอง,อำนาจเจริญ,อุดรธานี,อุตรดิตถ์,อุทัยธานี,อุบลราชธานี'.split(',');
const IC = {home:'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',check:'M5 13l4 4L19 7',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',hist:'M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5M12 7v5l3 2',share:'M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13',cog:'M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z',users:'M17 20v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 10a4 4 0 100-8 4 4 0 000 8zM21 20v-2a4 4 0 00-3-3.9M16 2.1a4 4 0 010 7.8',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',img:'M4 5h16v14H4zM8.5 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM20 16l-5-5-9 8',out:'M9 21H5a1 1 0 01-1-1V4a1 1 0 011-1h4M16 17l5-5-5-5M21 12H9',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',plus:'M12 5v14M5 12h14',heart:'M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z',link:'M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1',pay:'M3 7h18v10H3zM3 11h18',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',dl:'M12 3v12M7 10l5 5 5-5M4 20h16',menu:'M4 6h16M4 12h16M4 18h16',x:'M6 6l12 12M18 6L6 18',gift:'M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z'};
const ic = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
/* storage: localStorage -> cookie -> memory (รองรับ iOS) */
const mem = {}; const st = {
  get(k) { try { const v = localStorage.getItem(k); if (v) return v; } catch (e) {} const m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : mem[k] || ''; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} try { document.cookie = k + '=' + encodeURIComponent(v) + ';max-age=31536000;path=/;SameSite=None;Secure'; } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} try { document.cookie = k + '=;max-age=0;path=/'; } catch (e) {} }
};
const VID = (() => { let v = st.get('ls_vid'); if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); st.set('ls_vid', v); } return v; })();
/* เรียก Apps Script Web App (POST แบบ text/plain เพื่อเลี่ยง CORS preflight) */
const call = async (a, p = {}) => {
  let r; try { r = await fetch(API, {method: 'POST', body: JSON.stringify({a, p: Object.assign({t: T, vid: VID}, p)})}); r = await r.json(); } catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่'); }
  if (r && r.ok) return r.d; throw new Error(r ? r.m : 'เซิร์ฟเวอร์ไม่ตอบกลับ');
};
let T = st.get('ls_token'), S = {}, STAT = {}, B = [], ME = null, tab = '';
const toast = (t, i = 'success') => Swal.fire({toast: true, position: 'top', icon: i, title: t, showConfirmButton: false, timer: 2200});
const err = e => { if (e.message === 'EXPIRED') return boot(); if (e.message === 'AUTH') { st.del('ls_token'); T = ''; return boot(); } Swal.fire({icon: 'error', title: 'ไม่สำเร็จ', text: e.message, confirmButtonColor: '#ff5a1f'}); };
const busy = async (fn) => { Swal.fire({title: 'กำลังดำเนินการ...', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); try { const r = await fn(); Swal.close(); return r; } catch (e) { Swal.close(); err(e); } };
const shrink = (file, max = 800) => new Promise(res => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => { const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); }; i.src = r.result; }; r.readAsDataURL(file); });
const pick = (cb, max) => { const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*'; f.onchange = async () => f.files[0] && cb(await shrink(f.files[0], max)); f.click(); };
const qr = amt => `https://promptpay.io/${S.promptpayId}/${amt}.png`;
const inp = (id, ph, type = 'text', v = '') => `<input id="${id}" type="${type}" placeholder="${ph}" value="${esc(v)}" class="in" autocomplete="off">`;
const copyTxt = t => navigator.clipboard.writeText(t).then(() => toast('คัดลอกแล้ว')).catch(() => toast('คัดลอกไม่สำเร็จ', 'error'));

async function boot() {
  const r = await call('init').catch(e => ({s: {}, banners: []})); S = r.s || {}; B = r.banners || []; STAT = r; document.title = S.siteName || 'AmiRials'; if (!window.__pg) window.__pg = setInterval(() => call('ping').then(x => { document.querySelectorAll('#onl').forEach(el => el.textContent = x.online); }).catch(() => {}), 60000);
  if (PUB) return pubView();
  if (T) { try { ME = await call('me'); return shell(); } catch (e) { st.del('ls_token'); T = ''; } }
  loginView();
}

/* ---------- INSTALL (ทางลัดเข้าแอป) ---------- */
let DP = null; addEventListener('beforeinstallprompt', e => { e.preventDefault(); DP = e; });
try { const mf = {name: 'AmiRials', short_name: 'AmiRials', start_url: BASE, display: 'standalone', background_color: '#fff7ef', theme_color: '#ff5a1f', icons: [{src: LOGO, sizes: '512x512', type: 'image/png'}]}; const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type: 'application/manifest+json'})); document.head.appendChild(l); } catch (e) {}
async function installApp() {
  if (DP) { DP.prompt(); await DP.userChoice; DP = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  await Swal.fire({title: 'ติดตั้งบนอุปกรณ์', imageUrl: LOGO, imageWidth: 72, imageHeight: 72, html: ios ? '<b>iPhone/iPad (Safari)</b><br>แตะปุ่มแชร์ → <b>เพิ่มลงในหน้าจอโฮม</b>' : '<b>Android / คอมพิวเตอร์ (Chrome, Edge)</b><br>เมนู ⋮ → <b>ติดตั้งแอป</b> / <b>เพิ่มลงหน้าจอหลัก</b> / <b>สร้างทางลัด</b>', confirmButtonText: 'เข้าใจแล้ว', confirmButtonColor: '#ff5a1f'});
}
const showSlip = url => Swal.fire({imageUrl: url, imageAlt: 'สลิปการโอน', imageWidth: '100%', width: 440, showCloseButton: true, showConfirmButton: false});

/* ---------- AUTH ---------- */
function frame(inner) { $('#app').innerHTML = `<div class="hero min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-md rise"><div class="text-center text-white mb-5"><img src="${LOGO}" class="w-20 h-20 rounded-2xl mx-auto mb-2 shadow-lg object-cover" alt="logo"><div class="text-3xl font-bold">${esc(S.siteName || 'AmiRials')}</div><div class="opacity-90 text-sm mt-1">แลกติดตาม ไลค์ คอมเมนต์ ดันยอดแคมเปญ Shopee</div></div><div class="box">${inner}</div><div class="flex items-center justify-between gap-2 text-white text-sm mt-3"><span class="flex items-center gap-1.5"><i class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-300 animate-pulse"></i>ออนไลน์ <b id="onl">${STAT.online || 1}</b> คน • เข้าชม ${STAT.views || 0} (วันนี้ ${STAT.viewsToday || 0})</span><button class="btn ghost sm" onclick="installApp()">${ic('dl', 'w-4 h-4')} ติดตั้งบนอุปกรณ์</button></div></div></div>`; }
function loginView() {
  frame(`<div class="space-y-3"><h2 class="text-xl font-semibold">เข้าสู่ระบบ</h2>${REF ? `<div class="rounded-xl bg-orange-50 text-sm p-3">${ic('gift', 'w-4 h-4 inline')} คุณได้รับคำเชิญจาก <b>@${esc(REF)}</b> กด “สมัครสมาชิก” เพื่อสมัครผ่านลิงก์แนะนำ</div>` : ''}${inp('li', 'อีเมลหรือ username')}${inp('lp', 'รหัสผ่าน', 'password')}<button class="btn w-full" onclick="doLogin()">เข้าสู่ระบบ</button><div class="flex justify-between text-sm"><a href="#" class="text-orange-600" onclick="regStart('forgot');return false">ลืมรหัสผ่าน</a><a href="#" class="text-orange-600 font-medium" onclick="regStart('register');return false">สมัครสมาชิก</a></div></div>`);
}
async function doLogin() { const ok = await busy(async () => { const r = await call('login', {id: $('#li').value, password: $('#lp').value}); T = r.token; st.set('ls_token', T); ME = await call('me'); return 1; }); if (ok) shell(); }
async function regStart(mode) {
  const { value: email } = await Swal.fire({title: mode === 'forgot' ? 'ลืมรหัสผ่าน' : 'สมัครสมาชิก', text: 'กรอกอีเมลเพื่อรับรหัส OTP', input: 'email', inputPlaceholder: 'you@email.com', showCancelButton: true, confirmButtonText: 'ส่ง OTP', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ff5a1f'});
  if (!email) return; const r = await busy(() => call('start', {email})); if (!r) return;
  const { value: code } = await Swal.fire({title: 'กรอกรหัส OTP', html: r.exists ? 'อีเมลนี้สมัครแล้ว ยืนยันเพื่อตั้งรหัสผ่านใหม่' : 'ส่งรหัสไปที่ ' + esc(email), input: 'text', inputAttributes: {inputmode: 'numeric', maxlength: 6}, showCancelButton: true, confirmButtonText: 'ยืนยัน', confirmButtonColor: '#ff5a1f'});
  if (!code) return; const v = await busy(() => call('verify', {email, code})); if (!v) return;
  v.exists ? resetView(v.ticket) : regView(v.ticket, email);
}
function resetView(tk) { frame(`<div class="space-y-3"><h2 class="text-xl font-semibold">ตั้งรหัสผ่านใหม่</h2>${inp('np', 'รหัสผ่านใหม่ (6 ตัวขึ้นไป)', 'password')}<button class="btn w-full" onclick="doFinish('${tk}')">บันทึกรหัสผ่าน</button><button class="btn ghost w-full" onclick="loginView()">ยกเลิก</button></div>`); }
let SLIP = '';
function regView(tk, email) { SLIP = ''; frame(`<div class="space-y-3"><h2 class="text-xl font-semibold">ข้อมูลสมัครสมาชิก</h2><div class="text-sm text-gray-500">${esc(email)}</div>${inp('np', 'กำหนดรหัสผ่าน (6 ตัวขึ้นไป)', 'password')}${inp('fn', 'ชื่อ-สกุล')}${inp('un', 'username (a-z 0-9 _)')}${inp('ph', 'เบอร์โทร', 'tel')}<select id="pv" class="in"><option value="">เลือกจังหวัด</option>${PROV.map(p => `<option>${p}</option>`).join('')}</select>${inp('rf', 'username ผู้แนะนำ (ถ้ามี)', 'text', REF)}<div class="text-center bg-orange-50 rounded-2xl p-3"><div class="font-medium">ค่าสมาชิกรายเดือน ${esc(S.regFee)} บาท (พร้อมเพย์)</div><img src="${qr(S.regFee)}" class="mx-auto w-48 mt-2 rounded-xl" alt="QR พร้อมเพย์"></div><button class="btn ghost w-full" onclick="pick(d=>{SLIP=d;$('#sp').src=d;$('#sp').classList.remove('hidden')})">${ic('cam')} แนบสลิปการโอน</button><img id="sp" class="hidden mx-auto max-h-64 rounded-xl"><button class="btn w-full" onclick="doFinish('${tk}')">สมัครสมาชิก</button><p class="text-xs text-gray-500 text-center">สมัครได้ระดับ user เท่านั้น ต้องรอแอดมินอนุมัติ และต้องต่ออายุสมาชิกทุกเดือน</p></div>`); }
async function doFinish(tk) {
  const g = i => $('#' + i) ? $('#' + i).value : ''; const r = await busy(() => call('finish', {ticket: tk, password: g('np'), fullName: g('fn'), username: g('un'), phone: g('ph'), province: g('pv'), ref: g('rf'), slip: SLIP}));
  if (!r) return; await Swal.fire({icon: 'success', title: r.mode === 'reset' ? 'เปลี่ยนรหัสผ่านแล้ว' : 'ส่งใบสมัครแล้ว', text: r.mode === 'reset' ? 'เข้าสู่ระบบด้วยรหัสใหม่ได้เลย' : 'รอแอดมินตรวจสลิปและอนุมัติ จึงจะเข้าสู่ระบบได้', confirmButtonColor: '#ff5a1f'}); loginView();
}
async function logout() { try { await call('logout', {t: T}); } catch (e) {} st.del('ls_token'); T = ''; ME = null; tab = ''; loginView(); }

/* ---------- SHELL ---------- */
const isAd = () => ME.u.role !== 'user';
const TABS = {user: [['profile', 'โปรไฟล์', 'user'], ['mission', 'ภารกิจ', 'check'], ['posts', 'โพสต์', 'link'], ['history', 'ประวัติ', 'hist'], ['share', 'แชร์ลิงก์', 'share']], admin: [['dash', 'แดชบอร์ด', 'chart'], ['users', 'สมาชิก', 'users'], ['pay', 'ตรวจสลิป', 'pay'], ['aposts', 'โพสต์', 'list'], ['banners', 'แบนเนอร์', 'img']], sa: [['sa', 'Superadmin', 'shield'], ['settings', 'ตั้งค่า', 'cog']]};
function renewView() {
  const r = ME.ref || {disc: 0, pay: S.regFee};
  frame(`<div class="space-y-3 text-center"><h2 class="text-xl font-semibold">สมาชิกหมดอายุ</h2><p class="text-sm text-gray-500">ต่ออายุสมาชิกรายเดือน ${esc(S.regFee)} บาท (แยกจากค่าแชร์ลิงก์)${ME.u.memberUntil ? '<br>หมดอายุเมื่อ ' + esc(ME.u.memberUntil) : ''}</p>${r.disc > 0 ? `<div class="rounded-xl bg-emerald-50 text-emerald-700 text-sm p-3">${ic('gift', 'w-4 h-4 inline')} ส่วนลดจากการแนะนำเพื่อน -${r.disc} บาท<br>ชำระเพียง <b>${r.pay} บาท</b></div>` : ''}<button class="btn w-full" onclick="payMember()">ชำระเงินและแนบสลิป</button><button class="btn ghost w-full" onclick="logout()">ออกจากระบบ</button></div>`);

function shell() {

  async aposts() { const l = await call('allPosts'); return l.length ? l.map(p => `<div class="box flex justify-between items-center gap-2"><div class="min-w-0"><div class="font-medium truncate">${esc(p.title)}</div><div class="text-xs text-gray-500">@${esc(p.by)} • ${esc(p.at)}</div><a class="text-xs text-orange-600 truncate block" target="_blank" href="${esc(p.url)}">${esc(p.url)}</a></div><button class="btn ghost sm" onclick="delPost('${p.id}')">${ic('trash', 'w-4 h-4')}</button></div>`).join('') : empty('ยังไม่มีโพสต์'); },
  async banners() { const l = await call('banners'); window.BL = l; return `<button class="btn w-full" onclick="editBan()">${ic('plus')} เพิ่มแบนเนอร์</button>` + l.map((b, i) => `<div class="box space-y-2"><img src="${esc(b.img)}" class="w-full rounded-xl"><div class="flex justify-between text-sm"><b>${esc(b.title)}</b><span>กด ${b.clicks} ครั้ง • ${b.active ? 'แสดง' : 'ซ่อน'}</span></div><div class="flex gap-2"><button class="btn ghost sm" onclick="editBan(${i})">แก้ไข</button><button class="btn ghost sm" onclick="delBan('${b.id}')">ลบ</button></div></div>`).join(''); },
  async settings() { const s = await call('getSettings'); const f = [['siteName', 'ชื่อเว็บ'], ['regFee', 'ค่าสมาชิกรายเดือน (บาท)'], ['shareFee', 'ค่าแชร์ลิงก์โปรไฟล์/เดือน (บาท) แยกจากค่าสมาชิก'], ['promptpayId', 'เบอร์/เลขพร้อมเพย์'], ['adminFb', 'ลิงก์ Facebook แอดมิน'], ['missionsPerPost', 'ภารกิจขั้นต่ำต่อ 1 โพสต์/วัน'], ['refDiscount', 'ส่วนลดต่อผู้แนะนำ 1 คน (บาท) ตั้ง 0 = ปิดระบบส่วนลด'], ['refMax', 'ส่วนลดสูงสุดต่อรอบการต่ออายุ (บาท)']]; return `<div class="box space-y-3">${f.map(k => `<label class="block text-sm text-gray-600">${k[1]}${inp('s_' + k[0], '', 'text', s[k[0]])}</label>`).join('')}<button class="btn w-full" onclick="saveSet(${JSON.stringify(f.map(k => k[0])).replace(/"/g, '&quot;')})">บันทึกการตั้งค่า</button></div>`; }
};

/* ---------- ACTIONS ---------- */
const uext = async (id, field) => { const r = await busy(() => call('userExtend', {id, field, days: 30})); if (r) { toast('ต่ออายุถึง ' + r); render(); } };
const upass = async id => { const r = await Swal.fire({title: 'ตั้งรหัสผ่านใหม่ให้สมาชิก', input: 'text', inputPlaceholder: 'อย่างน้อย 6 ตัวอักษร', showCancelButton: true, confirmButtonColor: '#ff5a1f'}); if (r.value && await busy(() => call('userSetPass', {id, password: r.value}))) toast('ตั้งรหัสผ่านแล้ว'); };
const makeAdm = async () => { if (await busy(() => call('makeAdmin', {key: $('#nadm').value}))) { toast('เพิ่มแอดมินแล้ว'); render(); } };
const saveAfb = async () => { if (await busy(() => call('saveAdminFb', {url: $('#afb').value}))) { S.adminFb = $('#afb').value; toast('บันทึกแล้ว'); } };
const clickBan = (id, link) => { call('bannerClick', {id}).catch(() => {}); window.open(link, '_blank'); };
async function setTheme(i) { await call('saveProfile', {theme: i}); render(); }
async function saveSoc() { if (await busy(() => call('saveProfile', {fbUrl: $('#fb').value, igUrl: $('#ig').value, wantFb: $('#wfb').checked, wantIg: $('#wig').checked}))) toast('บันทึกแล้ว'); }
let M = null;
async function newM(type) {
  M = await busy(() => call('getMission', {type})); if (!M) return; M.type = type;
  $('#mbox').innerHTML = type === 'follow'
    ? `<div class="box space-y-3 rise"><div class="font-semibold">ติดตาม @${esc(M.name)} บน ${M.platform}</div><a class="btn w-full" href="${esc(M.url)}" target="_blank">เปิดหน้า ${M.platform}</a><p class="text-sm text-gray-500">กดติดตามแล้วกลับมากรอกว่าคุณเป็นผู้ติดตามคนที่เท่าไหร่</p>${inp('ans', 'ผู้ติดตามคนที่ (ตัวเลข)', 'number')}<button class="btn mint w-full" onclick="subM()">ยืนยันภารกิจ</button></div>`
    : `<div class="box space-y-3 rise"><a href="${esc(M.url)}" target="_blank" class="block rounded-2xl overflow-hidden border border-orange-100 hover:shadow-lg transition">${M.image ? `<img src="${esc(M.image)}" referrerpolicy="no-referrer" class="w-full max-h-56 object-cover" onerror="this.remove()">` : `<div class="h-28 hero flex items-center justify-center text-white">${ic('link', 'w-8 h-8')}</div>`}<div class="p-3 flex items-center justify-between text-sm"><span class="text-gray-500 truncate">${esc(M.host)}</span><span class="font-semibold" style="color:var(--or)">เปิดลิงก์ ↗</span></div></a><p class="text-sm text-gray-600">เปิดลิงก์ในแท็บใหม่ → กดไลค์ + คอมเมนต์ + คลิกตะกร้า</p><p class="text-sm text-gray-500">คัดลอกชื่อสินค้าจากหน้า Shopee มาวางให้ตรงทุกตัวอักษร</p><textarea id="ans" class="in" rows="2" placeholder="วางชื่อสินค้า"></textarea><button class="btn mint w-full" onclick="subM()">ยืนยันภารกิจ</button></div>`;
}
async function subM() { const ok = await busy(() => call('submitMission', {type: M.type, targetUserId: M.uid, postId: M.postId, answer: $('#ans').value})); if (ok) { await Swal.fire({icon: 'success', title: 'ภารกิจสำเร็จ', timer: 1400, showConfirmButton: false}); go('profile'); } }
async function addPost() { const g = i => $('#' + i).value; if (await busy(() => call('addPost', {url: g('pu'), name: g('pn')}))) { toast('โพสต์แล้ว'); render(); } }
async function delPost(id) { if ((await Swal.fire({title: 'ลบโพสต์นี้?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ff5a1f', confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก'})).isConfirmed) { await busy(() => call('delPost', {id})); render(); } }
async function payMember() { const fresh = await busy(() => call('me')); if (!fresh) return; ME = fresh; const r = ME.ref; payFlow(r.pay, 'requestMember', 'ส่งสลิปแล้ว', 'รอแอดมินอนุมัติ แล้วเข้าสู่ระบบอีกครั้ง', r.disc > 0 ? `<p class="text-sm text-emerald-600 mt-1">ส่วนลดจากการแนะนำเพื่อน -${r.disc} บาท (ราคาปกติ ${r.fee} บาท)</p>` : ''); }
async function payShare() { payFlow(S.shareFee, 'requestShare', 'ส่งสลิปแล้ว', 'รอแอดมินอนุมัติ'); }
async function payFlow(fee, act, t1, t2, extra = '') { Swal.fire({title: 'ชำระ ' + fee + ' บาท', html: `<img src="${qr(fee)}" class="mx-auto w-52 rounded-xl">${extra}<p class="text-sm mt-2">สแกนจ่ายแล้วแนบสลิป</p>`, confirmButtonText: 'แนบสลิป', showCancelButton: true, confirmButtonColor: '#ff5a1f'}).then(r => r.isConfirmed && pick(async d => { const p = await Swal.fire({title: 'ยืนยันส่งสลิป?', imageUrl: d, imageWidth: 220, showCancelButton: true, confirmButtonColor: '#ff5a1f'}); if (p.isConfirmed && await busy(() => call(act, {slip: d}))) Swal.fire({icon: 'success', title: t1, text: t2, confirmButtonColor: '#ff5a1f'}); })); }
const ust = async (id, status) => { await busy(() => call('userStatus', {id, status})); toast('อัปเดตแล้ว'); render(); };
const urole = async (id, role) => { await busy(() => call('userRole', {id, role})); render(); };
const udel = async id => { if ((await Swal.fire({title: 'ลบสมาชิก?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ff5a1f'})).isConfirmed) { await busy(() => call('delUser', {id})); render(); } };
const pst = async (id, ok) => { await busy(() => call('payStatus', {id, ok})); toast('เรียบร้อย'); render(); };
const delBan = async id => { await busy(() => call('delBanner', {id})); render(); };
let BIMG = '';
async function editBan(i) {
  const b = i === undefined ? {title: '', img: '', link: '', active: true} : BL[i]; BIMG = '';
  const r = await Swal.fire({title: 'แบนเนอร์', html: `<input id="bt" class="swal2-input" placeholder="ชื่อแบนเนอร์" value="${esc(b.title)}"><div class="my-3"><img id="bp" src="${esc(b.img)}" class="${b.img ? '' : 'hidden'} mx-auto max-h-40 rounded-xl mb-2"><button type="button" class="btn ghost sm" onclick="pick(d=>{BIMG=d;$('#bp').src=d;$('#bp').classList.remove('hidden')},1200)">${ic('img', 'w-4 h-4')} อัปโหลดรูปแบนเนอร์</button></div><input id="bl" class="swal2-input" placeholder="ลิงก์ปลายทาง (เปิดแท็บใหม่)" value="${esc(b.link)}"><label class="text-sm"><input type="checkbox" id="ba" ${b.active ? 'checked' : ''}> แสดงผล</label>`, showCancelButton: true, confirmButtonColor: '#ff5a1f', confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', preConfirm: () => { if (!BIMG && !b.img) { Swal.showValidationMessage('กรุณาอัปโหลดรูปแบนเนอร์'); return false; } return {id: b.id, title: $('#bt').value, file: BIMG, link: $('#bl').value, active: $('#ba').checked}; }});
  if (r.isConfirmed) { await busy(() => call('saveBanner', r.value)); render(); }
}
async function saveSet(keys) { const s = {}; keys.forEach(k => s[k] = $('#s_' + k).value); if (await busy(() => call('saveSettings', {s}))) { toast('บันทึกแล้ว'); const r = await call('init'); S = r.s; } }

/* ---------- PUBLIC SHARE PAGE ---------- */
async function pubView() {
  try { const d = await call('publicPage', {id: PUB}), u = d.user;
    $('#app').innerHTML = `<div class="max-w-md mx-auto p-4 space-y-4"><div class="t${u.theme} text-white rounded-3xl p-6 text-center rise"><div class="w-24 h-24 rounded-full bg-white/20 mx-auto overflow-hidden flex items-center justify-center">${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : ic('user', 'w-10 h-10')}</div><div class="text-xl font-bold mt-3">@${esc(u.username)}</div><div class="flex gap-2 mt-4 justify-center">${u.fbUrl ? `<a class="btn ghost sm" href="${esc(u.fbUrl)}" target="_blank">ติดตาม Facebook</a>` : ''}${u.igUrl ? `<a class="btn ghost sm" href="${esc(u.igUrl)}" target="_blank">ติดตาม Instagram</a>` : ''}</div></div>${d.posts.map(p => `<a href="${esc(p.url)}" target="_blank" class="block box !p-0 overflow-hidden">${p.image ? `<img src="${esc(p.image)}" referrerpolicy="no-referrer" class="w-full max-h-52 object-cover" onerror="this.remove()">` : ''}<div class="p-3"><div class="font-medium">${esc(p.title)}</div><div class="text-xs text-gray-500">${esc(p.host)}</div></div></a>`).join('') || empty('ยังไม่มีโพสต์')}</div>`;
  } catch (e) { $('#app').innerHTML = `<div class="p-10 text-center">${esc(e.message)}</div>`; }
}
boot();
</script>
</body>
</html>
